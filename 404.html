<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The static-host fallback for a path the host has no file for, which is every
      /team/{id} deep link. It loads the same shell as index.html, and the shell
      routes on the address it was loaded with, so the detail view renders without
      a redirect. Kept as a second build input rather than a copy in `public/` so
      it references the same hashed assets as index.html.
    -->
    <base href="/" />
    <title>VIP Teams Catalog (unofficial)</title>
    <!--
      Requirement 18.8 applies to any page of the Mirror_Site, and this is the page
      every /team/{id} deep link actually loads, so the pre-paint theme resolution
      from index.html is repeated here verbatim. See index.html for why it exists
      and why it is guarded.
    -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('vipmirror.theme'));
        if (
          stored !== null &&
          typeof stored === 'object' &&
          stored.storageVersion === '1' &&
          (stored.theme === 'light' ||
            stored.theme === 'dark' ||
            stored.theme === 'system')
        ) {
          document.documentElement.dataset.theme = stored.theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
